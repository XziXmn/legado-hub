contractVersion: "1.0"
id: xiaoshuohu_com
name: 小说虎
author: Yunwei
version: 0.1.1
type: source
domains:
  - xiaoshuohu.com
baseUrls:
  - https://www.xiaoshuohu.com
capabilities:
  - search
  - detail
  - toc
  - chapter
enabled: false
rateLimit:
  perHostConcurrency: 6
  minIntervalMs: 1000
proxy:
  mode: always
  required: true
browser:
  mode: none
  reason: ""
auth:
  mode: none
  cookieDomains: []
content:
  access: free
tags:
  - html
  - no-login
  - ads
  - search_provider
  - proxy
accessStrategy:
  search: search_provider
searchProvider:
  providerOrder:
    - bing_html
    - google_html
  targetDomain: www.xiaoshuohu.com
  querySitePath: /
  urlPatterns:
    - /\d+/\d+/?$
